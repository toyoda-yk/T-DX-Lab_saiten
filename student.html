<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生徒用 | T-DX Lab☆問題演習システム</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>T-DX Lab☆問題演習システム</h1><p>生徒用</p><div class="nav"><a href="index.html">トップへ</a></div></header>
<main>
<section id="loginPanel" class="panel login-card">
  <h2>ログイン</h2><div class="grid two"><div><label>4桁番号</label><input id="studentCode" inputmode="numeric" maxlength="4" placeholder="例：3101"></div><div><label>専用ログインコード</label><input id="accessCode" type="password" autocomplete="current-password" placeholder="配布されたコード"></div></div>
  <div id="loginMsg" class="small muted" style="margin-top:10px">試作確認用：3101 / DEMO-7KQ3-M9TZ</div><div class="actions"><button id="loginBtn">ログイン</button></div>
</section>
<section id="examListPanel" class="panel hidden"><div class="section-title"><div><h2 style="margin:0">公開中の試験</h2><div id="who" class="muted small"></div></div><button id="logoutBtn" class="secondary">ログアウト</button></div><div id="examList" class="grid two" style="margin-top:14px"></div></section>
<section id="examPanel" class="panel hidden"><div class="section-title"><div><span id="examSubject" class="badge"></span><h2 id="examTitle" style="margin:7px 0 0"></h2></div><button id="backBtn" class="secondary">試験一覧へ</button></div><div style="margin:16px 0"><div class="small"><span id="answeredCount">0</span> / <span id="questionCount">0</span> 回答済み</div><div class="progressbar"><div id="answerProgress"></div></div></div><form id="answerForm"></form><div class="actions"><button type="button" id="submitBtn" class="orange">提出して採点</button></div><div id="submitNote" class="small muted" style="margin-top:8px"></div></section>
<section id="resultPanel" class="hidden"><div id="resultSheet" class="panel"><div class="score-hero"><span class="badge">RESULT</span><h2 id="resultTitle"></h2><div><span class="score" id="scoreValue"></span><span class="den"> / 100</span></div><p id="resultCode" class="muted"></p></div><h3>大問別</h3><div id="sectionBars"></div><h3>問題別結果</h3><div style="overflow:auto"><table><thead><tr><th>設問</th><th>あなたの解答</th><th>正答</th><th>結果</th><th>得点</th></tr></thead><tbody id="detailBody"></tbody></table></div><div class="notice small" style="margin-top:16px">この速報版はあなた自身の採点結果です。クラス集計・全体集計が公開された後は、平均・分布・自分の位置を含む最終版に拡張する予定です。</div></div><div class="actions no-print"><button id="pdfBtn">成績表をPDF保存</button><button id="resultBackBtn" class="secondary">試験一覧へ</button></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script src="js/common.js"></script><script src="js/student.js"></script></body></html>
